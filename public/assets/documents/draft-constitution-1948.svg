<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <defs>
    <radialGradient id="leather-vignette" cx="50%" cy="50%" r="65%">
      <stop offset="40%" stop-color="#2D1F13"/>
      <stop offset="85%" stop-color="#1A120B"/>
      <stop offset="100%" stop-color="#0E0A06"/>
    </radialGradient>
    <linearGradient id="gold-emboss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#997A15"/>
      <stop offset="100%" stop-color="#594406"/>
    </linearGradient>
  </defs>

  <!-- Leather-bound Folio Cover -->
  <rect width="800" height="1050" fill="url(#leather-vignette)"/>

  <!-- Ornate Gilt Border Framing -->
  <rect x="35" y="35" width="730" height="980" fill="none" stroke="url(#gold-emboss)" stroke-width="4"/>
  <rect x="45" y="45" width="710" height="960" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.8"/>
  <rect x="55" y="55" width="690" height="940" fill="none" stroke="url(#gold-emboss)" stroke-width="2"/>

  <!-- Corner Filigrees -->
  <g fill="url(#gold-emboss)">
    <polygon points="65,65 110,65 65,110"/>
    <polygon points="735,65 690,65 735,110"/>
    <polygon points="65,985 110,985 65,940"/>
    <polygon points="735,985 690,985 735,940"/>
  </g>

  <!-- Top Seal / Emblem Simulation -->
  <circle cx="400" cy="180" r="48" fill="none" stroke="url(#gold-emboss)" stroke-width="2.5"/>
  <circle cx="400" cy="180" r="42" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="400" y="174" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="url(#gold-emboss)" letter-spacing="2">CONSTITUENT ASSEMBLY</text>
  <text x="400" y="190" text-anchor="middle" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#FCEBA4">OF INDIA</text>

  <!-- Title Heading -->
  <text x="400" y="290" text-anchor="middle" font-family="'Times New Roman', serif" font-size="28" font-weight="bold" letter-spacing="4" fill="url(#gold-emboss)">DRAFT CONSTITUTION</text>
  <text x="400" y="325" text-anchor="middle" font-family="'Times New Roman', serif" font-size="24" font-weight="bold" letter-spacing="3" fill="#FCEBA4">OF INDIA</text>
  <text x="400" y="370" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#D4AF37">PREPARED BY THE DRAFTING COMMITTEE</text>

  <line x1="200" y1="400" x2="600" y2="400" stroke="url(#gold-emboss)" stroke-width="2"/>

  <!-- Inscription Block -->
  <rect x="130" y="440" width="540" height="290" rx="6" fill="#140E08" stroke="#D4AF37" stroke-width="1.2" opacity="0.9"/>

  <text x="400" y="485" text-anchor="middle" font-family="'Times New Roman', serif" font-size="15" font-weight="bold" fill="#FCEBA4">MEMBERS OF THE DRAFTING COMMITTEE:</text>
  <text x="400" y="525" text-anchor="middle" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" letter-spacing="1" fill="#FFFFFF">DR. B. R. AMBEDKAR (CHAIRMAN)</text>
  <text x="400" y="555" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" fill="#E2BC72">N. Gopalaswami Ayyangar • Alladi Krishnaswami Ayyar</text>
  <text x="400" y="580" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" fill="#E2BC72">K. M. Munshi • Saiyid Mohd. Saadulla</text>
  <text x="400" y="605" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" fill="#E2BC72">N. Madhava Rao • D. P. Khaitan</text>

  <line x1="220" y1="640" x2="580" y2="640" stroke="#8C6826" stroke-width="1"/>
  <text x="400" y="675" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#D4AF37">SUBMITTED TO THE HON'BLE PRESIDENT</text>
  <text x="400" y="695" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#FCEBA4">ON 21ST FEBRUARY, 1948</text>

  <!-- Bottom Archival Stamp -->
  <text x="400" y="800" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-style="italic" fill="#C5A059">“We are going to enter into a life of contradictions.</text>
  <text x="400" y="820" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-style="italic" fill="#C5A059">In politics we will have equality, and in social and economic life</text>
  <text x="400" y="840" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-style="italic" fill="#C5A059">we will have inequality.”</text>
  <text x="400" y="870" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#FCEBA4">— DR. B. R. AMBEDKAR</text>

  <!-- Registration Number at Foot -->
  <text x="400" y="930" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.5" fill="#8C6826">PARLIAMENT HOUSE ARCHIVE • CALL NO. CAD-DRAFT-1948-OFFICIAL</text>
</svg>
