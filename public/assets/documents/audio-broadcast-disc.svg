<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Vinyl Grooves Radial Pattern -->
    <radialGradient id="groove-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="25%" stop-color="#2B2B2B"/>
      <stop offset="28%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#2D2D2D"/>
      <stop offset="53%" stop-color="#181818"/>
      <stop offset="75%" stop-color="#333333"/>
      <stop offset="78%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </radialGradient>
    <radialGradient id="gold-label-foil" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="35%" stop-color="#C5A059"/>
      <stop offset="70%" stop-color="#8C6826"/>
      <stop offset="100%" stop-color="#5A4012"/>
    </radialGradient>
    <linearGradient id="sheen-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="800" fill="#0A1D2B"/>

  <!-- Outer Vinyl Rim -->
  <circle cx="400" cy="400" r="370" fill="url(#groove-sheen)" stroke="#4A3B22" stroke-width="4"/>
  <circle cx="400" cy="400" r="364" fill="none" stroke="#222222" stroke-width="1.5"/>

  <!-- Sound Grooves Simulation -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#242424" stroke-width="1" stroke-dasharray="80 3"/>
  <circle cx="400" cy="400" r="315" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>
  <circle cx="400" cy="400" r="290" fill="none" stroke="#2A2A2A" stroke-width="1"/>
  <circle cx="400" cy="400" r="265" fill="none" stroke="#222222" stroke-width="1.2"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="#262626" stroke-width="1"/>
  <circle cx="400" cy="400" r="215" fill="none" stroke="#1E1E1E" stroke-width="1.5"/>
  <circle cx="400" cy="400" r="190" fill="none" stroke="#2B2B2B" stroke-width="1"/>
  <circle cx="400" cy="400" r="165" fill="none" stroke="#202020" stroke-width="1.2"/>

  <!-- Run-out Groove Area -->
  <circle cx="400" cy="400" r="145" fill="#141414" stroke="#2E2416" stroke-width="1"/>
  <path d="M400,265 A135,135 0 0,1 525,445 A135,135 0 0,1 320,520" fill="none" stroke="#222" stroke-width="1.5"/>

  <!-- Central Gold Foil Record Label (78 RPM Master Shellac) -->
  <circle cx="400" cy="400" r="130" fill="url(#gold-label-foil)" stroke="#3A2807" stroke-width="3"/>
  <circle cx="400" cy="400" r="122" fill="none" stroke="#5A4012" stroke-width="1.5"/>
  <circle cx="400" cy="400" r="118" fill="none" stroke="#FCEBA4" stroke-width="0.8"/>

  <!-- Center Hole -->
  <circle cx="400" cy="400" r="22" fill="#0A1D2B" stroke="#2A1B04" stroke-width="2"/>
  <circle cx="400" cy="400" r="16" fill="#050C12"/>

  <!-- Label Typography & Archival Badges -->
  <text x="400" y="318" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" letter-spacing="2" fill="#1A1204">ALL INDIA RADIO &amp; BBC SOUND ARCHIVES</text>
  <text x="400" y="334" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" letter-spacing="1.5" fill="#3D2908">HISTORIC BROADCAST MASTER • 78 RPM</text>

  <line x1="300" y1="344" x2="500" y2="344" stroke="#3D2908" stroke-width="1"/>

  <!-- Track Title -->
  <text x="400" y="364" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#0A0802">DEMOCRACY &amp; SOCIAL EQUALITY</text>
  <text x="400" y="378" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" font-style="italic" fill="#241804">Address by Dr. B. R. Ambedkar</text>

  <!-- Lower Label Metadata -->
  <line x1="310" y1="426" x2="490" y2="426" stroke="#3D2908" stroke-width="1"/>
  <text x="400" y="442" text-anchor="middle" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" letter-spacing="1" fill="#1F1505">MATRIX NO: BBC-LON-1952-AMB-01</text>
  <text x="400" y="458" text-anchor="middle" font-family="'Times New Roman', serif" font-size="8" fill="#3D2908">AUTHENTICATED BROADCAST FACSIMILE</text>

  <!-- Top Archival Stamp -->
  <rect x="50" y="50" width="220" height="42" rx="4" fill="#082536" stroke="#C5A059" stroke-width="1.5" opacity="0.95"/>
  <text x="65" y="70" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#F8F3EA">HISTORIC AUDIO DISC</text>
  <text x="65" y="84" font-family="'Courier New', monospace" font-size="9" fill="#C5A059">ARCHIVE ID: AUD-HIST-78RPM</text>

  <!-- Light Sheen Reflection -->
  <circle cx="400" cy="400" r="370" fill="url(#sheen-glare)" pointer-events="none"/>
</svg>
