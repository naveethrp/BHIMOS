<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <defs>
    <radialGradient id="sm-vignette" cx="50%" cy="50%" r="60%">
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7A6240" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1050" fill="#FBF7EE"/>
  <rect width="800" height="1050" fill="url(#sm-vignette)"/>

  <!-- Ornate Border Framing -->
  <rect x="35" y="35" width="730" height="980" fill="none" stroke="#2B261F" stroke-width="2.5"/>
  <rect x="42" y="42" width="716" height="966" fill="none" stroke="#A87820" stroke-width="1"/>

  <!-- Archival Header -->
  <text x="400" y="90" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" letter-spacing="2" fill="#554433">ALL-INDIA SCHEDULED CASTES FEDERATION MEMORANDUM</text>
  <line x1="100" y1="110" x2="700" y2="110" stroke="#8C6826" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="400" y="190" text-anchor="middle" font-family="'Times New Roman', serif" font-size="34" font-weight="bold" letter-spacing="2" fill="#1A1815">STATES AND MINORITIES</text>
  <text x="400" y="235" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" font-style="italic" fill="#3D352B">What are their Rights and How to Secure them in the Constitution of Free India</text>

  <line x1="250" y1="270" x2="550" y2="270" stroke="#2B261F" stroke-width="1"/>

  <text x="400" y="320" text-anchor="middle" font-family="'Times New Roman', serif" font-size="18" fill="#1A1815">BY</text>
  <text x="400" y="360" text-anchor="middle" font-family="'Times New Roman', serif" font-size="24" font-weight="bold" fill="#082536">DR. B. R. AMBEDKAR</text>
  <text x="400" y="388" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" fill="#554433">M.A., Ph.D., D.Sc., Bar-at-Law, Member, Constituent Assembly of India</text>

  <!-- Central Parchment Excerpt Box -->
  <rect x="90" y="430" width="620" height="320" rx="4" fill="#F4EDE0" stroke="#A87820" stroke-width="1.5"/>

  <text x="400" y="475" text-anchor="middle" font-family="'Times New Roman', serif" font-size="15" font-weight="bold" fill="#082536">PROPOSED CLAUSE — STATE SOCIALISM &amp; FUNDAMENTAL RIGHTS:</text>

  <g font-family="'Times New Roman', serif" font-size="13.5" fill="#241E17" letter-spacing="0.2">
    <text x="120" y="520">“The Constitution should declare that the plan for the economic life</text>
    <text x="120" y="545">of the community shall be based on state ownership of key industries</text>
    <text x="120" y="570">and basic agriculture with collective farming under state tenancy.</text>
    <text x="120" y="605">The main purpose is to establish state socialism by the law of the</text>
    <text x="120" y="630">constitution so that it will not be open to any legislature to</text>
    <text x="120" y="655">modify or suspend it without amending the constitution itself.”</text>
  </g>

  <line x1="200" y1="695" x2="600" y2="695" stroke="#C5A059" stroke-width="1"/>
  <text x="400" y="725" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#8C6826">PUBLISHED BY THACKER &amp; CO., LTD., BOMBAY • MARCH 1947</text>

  <!-- Official Red Wax Seal Facsimile -->
  <g transform="translate(400, 840)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#8B2500" stroke-width="2.5" stroke-dasharray="6 3"/>
    <circle cx="0" cy="0" r="39" fill="none" stroke="#8B2500" stroke-width="1"/>
    <text x="0" y="-12" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#8B2500">CONSTITUTIONAL</text>
    <text x="0" y="4" text-anchor="middle" font-family="'Times New Roman', serif" font-size="8.5" font-weight="bold" fill="#8B2500">MEMORANDUM</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#8B2500">1947 • OFFICIAL</text>
  </g>

  <text x="400" y="935" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#665544">NATIONAL ARCHIVES CLASSIFICATION: MEM-1947-SM-AMB</text>
</svg>
