<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="filmstrip-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1720"/>
      <stop offset="10%" stop-color="#1A242F"/>
      <stop offset="90%" stop-color="#1A242F"/>
      <stop offset="100%" stop-color="#0F1720"/>
    </linearGradient>
    <radialGradient id="sepia-vignette" cx="50%" cy="50%" r="55%">
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A1005" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Dark Cinema Slate Canvas -->
  <rect width="800" height="600" fill="#06121D"/>

  <!-- Outer Film Reel Cell -->
  <rect x="30" y="30" width="740" height="540" rx="8" fill="url(#filmstrip-bg)" stroke="#B8860B" stroke-width="2"/>

  <!-- Top Sprocket Holes (35mm Archival Film) -->
  <g fill="#06121D" stroke="#3D2908" stroke-width="1.5">
    <rect x="55" y="48" width="40" height="26" rx="4"/>
    <rect x="135" y="48" width="40" height="26" rx="4"/>
    <rect x="215" y="48" width="40" height="26" rx="4"/>
    <rect x="295" y="48" width="40" height="26" rx="4"/>
    <rect x="375" y="48" width="40" height="26" rx="4"/>
    <rect x="455" y="48" width="40" height="26" rx="4"/>
    <rect x="535" y="48" width="40" height="26" rx="4"/>
    <rect x="615" y="48" width="40" height="26" rx="4"/>
    <rect x="695" y="48" width="40" height="26" rx="4"/>
  </g>

  <!-- Bottom Sprocket Holes -->
  <g fill="#06121D" stroke="#3D2908" stroke-width="1.5">
    <rect x="55" y="526" width="40" height="26" rx="4"/>
    <rect x="135" y="526" width="40" height="26" rx="4"/>
    <rect x="215" y="526" width="40" height="26" rx="4"/>
    <rect x="295" y="526" width="40" height="26" rx="4"/>
    <rect x="375" y="526" width="40" height="26" rx="4"/>
    <rect x="455" y="526" width="40" height="26" rx="4"/>
    <rect x="535" y="526" width="40" height="26" rx="4"/>
    <rect x="615" y="526" width="40" height="26" rx="4"/>
    <rect x="695" y="526" width="40" height="26" rx="4"/>
  </g>

  <!-- Main Film Frame Window -->
  <rect x="60" y="90" width="680" height="420" rx="4" fill="#221C16" stroke="#C5A059" stroke-width="2"/>

  <!-- Vintage Sepia Tint & Vignette Inside Frame -->
  <rect x="60" y="90" width="680" height="420" fill="#3D3224" opacity="0.6"/>
  <rect x="60" y="90" width="680" height="420" fill="url(#sepia-vignette)"/>

  <!-- Archival Projection Slate Grid & Crosshair -->
  <circle cx="400" cy="300" r="160" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="400" cy="300" r="80" fill="none" stroke="#C5A059" stroke-width="1" opacity="0.3"/>
  <line x1="220" y1="300" x2="580" y2="300" stroke="#C5A059" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="130" x2="400" y2="470" stroke="#C5A059" stroke-width="1" opacity="0.3"/>

  <!-- Optical Sound Track Indicator on Left Edge -->
  <g opacity="0.7">
    <path d="M72,110 Q78,140 72,170 T72,230 T72,290 T72,350 T72,410 T72,470" fill="none" stroke="#E2BC72" stroke-width="2.5"/>
    <path d="M76,110 Q82,140 76,170 T76,230 T76,290 T76,350 T76,410 T76,470" fill="none" stroke="#E2BC72" stroke-width="1.5"/>
  </g>

  <!-- Newsreel Title Overlay -->
  <rect x="140" y="220" width="520" height="160" rx="4" fill="#081A26" fill-opacity="0.92" stroke="#C5A059" stroke-width="2"/>
  <text x="400" y="260" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" letter-spacing="3" fill="#C5A059">FILMS DIVISION OF INDIA • HISTORIC NEWSREEL</text>
  <text x="400" y="295" text-anchor="middle" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" fill="#F8F3EA">DR. B. R. AMBEDKAR: HISTORIC FOOTAGE</text>
  <text x="400" y="325" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" letter-spacing="1.5" fill="#E2BC72">CONSTITUENT ASSEMBLY &amp; DEEKSHABHOOMI (1949–1956)</text>
  <text x="400" y="352" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#A0B0C0">TC: 01:24:18:04 • 35MM B&amp;W SOUND MASTER • ARCHIVE NO. FD-HIST-1956</text>

  <!-- Top Timecode & Slate Header -->
  <text x="75" y="115" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#E2BC72">RECORDING DATE: 14 OCT 1956</text>
  <text x="725" y="115" text-anchor="end" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#E2BC72">REEL 04 / 35MM SOUND</text>

  <!-- Bottom Archival Stamp -->
  <g transform="translate(620, 440)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#B8860B" stroke-width="2" opacity="0.8"/>
    <text x="0" y="-10" text-anchor="middle" font-family="'Times New Roman', serif" font-size="8" font-weight="bold" fill="#F8F3EA">NATIONAL</text>
    <text x="0" y="4" text-anchor="middle" font-family="'Times New Roman', serif" font-size="8" font-weight="bold" fill="#C5A059">FILM ARCHIVE</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#F8F3EA">AUTHENTIC</text>
  </g>
</svg>
